<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in to Amazon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/pages/login.css">
</head>

<body class="login-page">
  <main class="login-shell">
    <a class="login-logo-link" href="index.html" aria-label="Amazon home">
      <img class="login-logo" src="images/amazon-logo.png" alt="Amazon">
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <div id="auth-error" class="auth-error" role="alert" aria-live="polite" hidden></div>

      <section id="signin-panel" class="auth-panel">
        <h1 id="login-title">Sign in</h1>
        <form id="signin-form">
          <label class="login-field" for="signin-email">Email or mobile phone number</label>
          <input
            class="login-input"
            id="signin-email"
            type="email"
            autocomplete="email"
            required>

          <label class="login-field" for="signin-password">Password</label>
          <input
            class="login-input"
            id="signin-password"
            type="password"
            autocomplete="current-password"
            required>

          <button class="amazon-yellow-button" id="btn-signin" type="submit">
            Sign in
          </button>
        </form>

        <p class="login-terms">
          By continuing, you agree to Amazon's Conditions of Use and Privacy Notice.
        </p>

        <div class="login-divider"><span>or continue with</span></div>
        <div class="social-buttons">
          <button class="google-button" id="btn-google" type="button">
            <svg class="social-icon google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/>
              <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"/>
              <path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6v-5.3H5.9a20 20 0 0 0 0 18.2l6.9-5.3Z"/>
              <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.9 14.9l6.9 5.3c1.6-4.8 6-8.3 11.2-8.3Z"/>
            </svg>
            Continue with Google
          </button>
          <button class="facebook-button" id="btn-facebook" type="button">
            <svg class="social-icon facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M13.5 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21h3.4Z"/>
            </svg>
            Continue with Facebook
          </button>
        </div>

        <div class="new-account-section">
          <div class="new-account-divider"><span>New to Amazon?</span></div>
          <button class="create-account-link" id="show-signup" type="button">
            Create your Amazon account
          </button>
        </div>
      </section>

      <section id="signup-panel" class="auth-panel" hidden>
        <h1>Create account</h1>
        <form id="signup-form">
          <label class="login-field" for="signup-name">Your name</label>
          <input
            class="login-input"
            id="signup-name"
            type="text"
            autocomplete="name"
            required>

          <label class="login-field" for="signup-email">Email</label>
          <input
            class="login-input"
            id="signup-email"
            type="email"
            autocomplete="email"
            required>

          <label class="login-field" for="signup-password">Password</label>
          <input
            class="login-input"
            id="signup-password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required>
          <small class="password-hint">Passwords must be at least 6 characters.</small>

          <button class="amazon-yellow-button" id="btn-signup" type="submit">
            Create your Amazon account
          </button>
        </form>

        <div class="login-divider"><span>or continue with</span></div>
        <div class="social-buttons">
          <button class="google-button" id="btn-google-signup" type="button">
            <svg class="social-icon google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/>
              <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"/>
              <path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6v-5.3H5.9a20 20 0 0 0 0 18.2l6.9-5.3Z"/>
              <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.9 14.9l6.9 5.3c1.6-4.8 6-8.3 11.2-8.3Z"/>
            </svg>
            Continue with Google
          </button>
          <button class="facebook-button" id="btn-facebook-signup" type="button">
            <svg class="social-icon facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M13.5 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H7.3v3.2h2.8V21h3.4Z"/>
            </svg>
            Continue with Facebook
          </button>
        </div>

        <p class="back-to-signin">
          Already have an account?
          <button id="show-signin" type="button">Sign in</button>
        </p>
      </section>
    </section>

    <footer class="login-footer">
      <a href="index.html">Back to Amazon</a>
    </footer>
  </main>

  <script type="module" src="scripts/login.js"></script>
</body>

</html>
