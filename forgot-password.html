<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Password Recovery - Bypay</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f6f8fa;
      padding: 20px;
      color: #0f1111;
      font-family: Roboto, Arial, sans-serif;
    }

    .reset-shell {
      width: 100%;
      max-width: 420px;
    }

    .logo-link {
      display: block;
      width: fit-content;
      margin: 0 auto 22px;
    }

    .logo {
      display: block;
      width: 150px;
      max-height: 52px;
      object-fit: contain;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 32px 28px;
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 500;
    }

    p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message {
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid #d00;
      border-radius: 4px;
      background: #fff4f4;
      color: #c40000;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.success {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .message[hidden] {
      display: none;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 42px;
      margin-bottom: 14px;
      padding: 8px 10px;
      border: 1px solid #888c8c;
      border-radius: 4px;
      font: inherit;
      font-size: 15px;
    }

    input:focus {
      outline: 3px solid #c8f3ff;
      border-color: #00a8e1;
    }

    .primary-button {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 4px;
      background: #00a8e1;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .primary-button:hover {
      background: #008fbe;
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #007185;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .text-link {
      display: inline-block;
      margin-top: 14px;
      color: #007185;
      font-size: 13px;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .reset-step[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <main class="reset-shell">
    <a class="logo-link" href="index.html" aria-label="Bypay sign in">
      <img class="logo" src="images/bypay-logo.png" alt="Bypay">
    </a>

    <section class="reset-card" aria-labelledby="reset-title">
      <div id="fp-message" class="message" role="status" aria-live="polite" hidden></div>

      <section class="reset-step" id="step-email">
        <h1 id="reset-title">Password Recovery</h1>
        <p>Enter the email address associated with your Bypay account.</p>
        <label for="fp-email">Email address</label>
        <input
          id="fp-email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required>
        <button class="primary-button" id="btn-send-code" type="button">
          Send 6-Digit Code
        </button>
        <a class="back-link" href="index.html">Back to Sign In</a>
      </section>

      <section class="reset-step" id="step-otp" hidden>
        <h1>Verify Your Email</h1>
        <p>Enter the 6-digit code sent to <strong id="fp-display-email"></strong>.</p>
        <label for="fp-otp">6-digit code</label>
        <input id="fp-otp" type="text" inputmode="numeric" autocomplete="one-time-code"
          maxlength="6" pattern="[0-9]{6}" required>
        <button class="primary-button" id="btn-verify-code" type="button">Verify Code</button>
        <a class="text-link" id="btn-resend-code" href="#">Resend Code</a>
      </section>

      <section class="reset-step" id="step-new-password" hidden>
        <h1>Create New Password</h1>
        <label for="fp-new-password">New Password</label>
        <input id="fp-new-password" type="password" autocomplete="new-password" minlength="6" required>
        <label for="fp-confirm-password">Confirm New Password</label>
        <input id="fp-confirm-password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="primary-button" id="btn-save-password" type="button">Save New Password</button>
      </section>

    </section>
  </main>

  <script type="module" src="scripts/forgot-password.js"></script>
</body>

</html>
