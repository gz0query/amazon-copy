<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>

  <!-- Load Roboto font family from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/orders.css">
</head>

<body>
  <!-- Top Navigation Header -->
  <header class="amazon-header">
    <div class="amazon-header-left-section">
      <a href="index.html" class="header-link">
        <img class="amazon-logo" src="images/amazon-logo-white.png" alt="Amazon Logo">
        <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png" alt="Amazon Mobile Logo">
      </a>
    </div>

    <div class="amazon-header-middle-section">
      <input class="search-bar" type="text" placeholder="Search">
      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png" alt="Search Icon">
      </button>
    </div>

    <div class="amazon-header-right-section">
      <a class="orders-link header-link" href="orders.html">
        <span class="returns-text">Returns</span>
        <span class="orders-text">& Orders</span>
      </a>

      <a class="cart-link header-link" href="checkout.html">
        <img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart Icon">
        <div class="cart-quantity js-cart-quantity">0</div>
        <div class="cart-text">Cart</div>
      </a>
    </div>
  </header>

  <!-- Orders Main Content -->
  <main class="main">
    <div class="page-title">Your Orders</div>

    <div class="orders-grid js-orders-grid">
      <!-- Sample Order Card -->
      <div class="order-container">
        <div class="order-header">
          <div class="order-header-left-section">
            <div class="order-date">
              <div class="order-header-label">Order Placed:</div>
              <div>August 12</div>
            </div>
            <div class="order-total">
              <div class="order-header-label">Total:</div>
              <div>$35.06</div>
            </div>
          </div>

          <div class="order-header-right-section">
            <div class="order-header-label">Order ID:</div>
            <div>27cba69d-4c3d-4098-b42d-ac7fa62b7664</div>
          </div>
        </div>

        <div class="order-details-grid">
          <div class="product-image-container">
            <img src="images/products/athletic-cotton-socks-6-pairs.jpg" alt="Athletic Cotton Socks">
          </div>

          <div class="product-details">
            <div class="product-name">
              Black and Gray Athletic Cotton Socks - 6 Pairs
            </div>
            <div class="product-delivery-date">
              Arriving on: August 15
            </div>
            <div class="product-quantity">
              Quantity: 1
            </div>
            <button class="buy-again-button button-primary">
              <img class="buy-again-icon" src="images/icons/buy-again.png" alt="Buy Again Icon">
              <span class="buy-again-message">Buy it again</span>
            </button>
          </div>

          <div class="product-actions">
            <a
              href="tracking.html?orderId=27cba69d-4c3d-4098-b42d-ac7fa62b7664&productId=e43638ce-6aa0-4b85-b27f-e1d07eb678c6">
              <button class="track-package-button button-secondary">
                Track package
              </button>
            </a>
          </div>

          <div class="product-image-container">
            <img src="images/products/adults-plain-cotton-tshirt-2-pack-teal.jpg" alt="Adults Plain Cotton T-Shirt">
          </div>

          <div class="product-details">
            <div class="product-name">
              Adults Plain Cotton T-Shirt - 2 Pack
            </div>
            <div class="product-delivery-date">
              Arriving on: August 19
            </div>
            <div class="product-quantity">
              Quantity: 2
            </div>
            <button class="buy-again-button button-primary">
              <img class="buy-again-icon" src="images/icons/buy-again.png" alt="Buy Again Icon">
              <span class="buy-again-message">Buy it again</span>
            </button>
          </div>

          <div class="product-actions">
            <a
              href="tracking.html?orderId=27cba69d-4c3d-4098-b42d-ac7fa62b7664&productId=15b6fc6f-327a-4ec4-896f-486349e85a3d">
              <button class="track-package-button button-secondary">
                Track package
              </button>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="scripts/orders.js"></script>
</body>

</html>
