<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- This code is needed for responsive design to work properly across device sizes. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bypay Project</title>

  <!-- Load Roboto font family from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/amazon.css">
</head>

<body>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-label="Main navigation" aria-hidden="true">
    <div class="sidebar-header">
      <span id="sidebar-name">Hello</span>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <nav class="sidebar-nav" aria-label="Store navigation">
      <ul class="sidebar-links"
        style="display: flex; flex-direction: column; flex-grow: 1; margin: 0; padding: 0; height: calc(100vh - 70px);">
        <li>
          <a class="sidebar-link" href="profile.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            <span>My Profile</span>
          </a>
        </li>
        <li>
          <a class="sidebar-link" href="orders.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h14v17l-7-4-7 4z"></path>
              <path d="M9 8h6M9 12h6"></path>
            </svg>
            <span>Orders</span>
          </a>
        </li>
        <li>
          <a class="sidebar-link" href="checkout.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"></path>
              <circle cx="10" cy="20" r="1"></circle>
              <circle cx="18" cy="20" r="1"></circle>
            </svg>
            <span>Cart</span>
          </a>
        </li>
        <li id="sidebar-admin-portal" style="display: none;">
          <a href="admin.html" style="color: #00A8E1; font-weight: 600; display: flex; align-items: center; gap: 12px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00A8E1" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Admin Portal
          </a>
        </li>
        <li style="margin-top: auto; border-top: 1px solid #eee;"><a href="#" id="sidebar-logout"
            style="color: #d9534f; font-weight: bold; padding: 15px 20px; display: flex; align-items: center; gap: 12px; text-decoration: none;"><svg
              width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d9534f" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg> Logout</a></li>
      </ul>
    </nav>
  </aside>

  <!-- Top Navigation Header -->
  <header class="amazon-header">
    <div class="amazon-header-left-section">
      <div class="hamburger-menu" id="hamburger-icon" role="button" tabindex="0" aria-label="Open navigation menu"
        aria-controls="sidebar-menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"></path>
        </svg>
      </div>
      <a href="amazon.html" class="header-link">
        <img class="amazon-logo" src="images/bypay-logo-white.png" alt="Bypay logo">
        <img class="amazon-mobile-logo" src="images/bypay-mobile-logo-white.png" alt="Bypay logo">
      </a>
    </div>

    <div class="amazon-header-middle-section">
      <input class="search-bar" type="text" placeholder="Search">
      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png" alt="Search">
      </button>
    </div>

    <div class="amazon-header-right-section">
      <div class="account-container" id="account-container">
        <a class="header-link header-profile-link" id="account-toggle" href="profile.html"
          style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white !important;">
          <img class="header-profile-avatar" id="header-avatar"
            src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="Profile"
            style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc;">
          <div class="header-profile-text" style="display: flex; flex-direction: column; align-items: flex-start;">
            <span class="greeting-text" id="user-greeting" style="font-size: 12px; line-height: 14px;"><span
                class="hello-prefix">Hello, </span><span class="first-name-only">Goodluck</span></span>
            <span class="account-text" style="font-size: 14px; font-weight: 700; line-height: 15px;">Account &amp;
              Lists</span>
          </div>
        </a>

        <div class="account-menu" id="account-menu" hidden>
          <button class="account-signout-button" id="btn-header-signout" type="button">
            Sign Out
          </button>
        </div>
      </div>

      <a class="orders-link header-link" href="orders.html">
        <span class="returns-text">Returns</span>
        <span class="orders-text">& Orders</span>
      </a>

      <a class="cart-link header-link" href="checkout.html">
        <img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart">
        <div class="cart-quantity js-cart-quantity">0</div>
        <div class="cart-text">Cart</div>
      </a>
    </div>
  </header>

  <!-- Main Products Container -->
  <main class="main">
    <div class="products-grid js-products-grid">
      <!-- Products will be dynamically generated here by scripts/amazon.js -->
    </div>
  </main>

  <!-- Main JavaScript Module Entry Point -->
  <script type="module" src="scripts/amazon.js"></script>
  <script type="module" src="scripts/chatbot.js"></script>
</body>

</html>
